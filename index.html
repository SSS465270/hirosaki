<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climin - 顧客管理アプリ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 1. ログイン画面（Step 1: ID検証 ＆ 1つ目のntfy送信） -->
    <div id="loginView" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <span class="text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full">Step 1 / 3: ユーザー確認</span>
                <h2 class="text-2xl font-bold text-slate-800">Climin ログイン</h2>
                <p class="text-sm text-slate-500">管理者名を入力してください。</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">ユーザー名 / ID</label>
                    <input type="text" id="loginId" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700 transition shadow-sm">
                    1つ目のコードを送信する
                </button>
            </form>
            <div class="text-center text-xs text-slate-400">
                ※許可された管理者IDのみログインできます。
            </div>
        </div>
    </div>

    <!-- 2. 第1段階認証コード入力画面 -->
    <div id="auth1View" class="fixed inset-0 bg-slate-900 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <span class="text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full">Step 2 / 3: 第1段階認証</span>
                <h2 class="text-2xl font-bold text-slate-800">1つ目のコード確認</h2>
                <p class="text-sm text-slate-500">コードを入力してください。</p>
            </div>

            <div class="space-y-4">
                <div class="p-3 bg-indigo-50 border border-indigo-200 text-indigo-800 text-xs rounded-lg text-center font-medium">
                   コードを送信しました。
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">確認コード (1)</label>
                    <input type="text" id="auth1CodeInput" maxlength="4" class="w-full text-center text-2xl tracking-widest px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold" placeholder="----">
                </div>
                <button type="button" onclick="verifyAuth1()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700 transition shadow-sm">
                    次へ（2つ目の認証へ進む）
                </button>
            </div>
        </div>
    </div>

    <!-- 3. 第2段階認証コード入力画面 -->
    <div id="auth2View" class="fixed inset-0 bg-slate-900 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <span class="text-xs bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full">Step 3 / 3: 第2段階認証</span>
                <h2 class="text-2xl font-bold text-slate-800">2つ目のコード確認</h2>
                <p class="text-sm text-slate-500">コードを入力してください。</p>
            </div>

            <div class="space-y-4">
                <div class="p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs rounded-lg text-center font-medium">
                    ✓ 送信しました。
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">確認コード (2)</label>
                    <input type="text" id="auth2CodeInput" maxlength="4" class="w-full text-center text-2xl tracking-widest px-3 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-bold" placeholder="----">
                </div>
                <button type="button" onclick="verifyAuth2()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-medium hover:bg-emerald-700 transition shadow-sm">
                    認証を完了してアプリに入る
                </button>
            </div>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <h1 class="text-xl font-bold tracking-wider cursor-pointer" onclick="goHome()">Climin</h1>
                <span id="currentViewTitle" class="text-xs bg-indigo-500 px-3 py-1 rounded-full">サービス選択ダッシュボード</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="userIdDisplay" class="text-sm">🔐 認証済み</span>
                <button onclick="logout()" class="text-xs bg-rose-600 px-3 py-1.5 rounded-lg hover:bg-rose-700 transition">ログアウト</button>
            </div>
        </div>
    </header>

    <!-- メインエリア -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <div id="dashboardView" class="space-y-8">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-slate-800">サービス・プロジェクト一覧</h2>
                <button onclick="openServiceModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition shadow-sm">＋ 新規サービスを追加</button>
            </div>
            <div id="serviceGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <div id="customerView" class="hidden grid grid-cols-1 md:grid-cols-3 gap-8">
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <span id="formServiceTag" class="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded">サービス名</span>
                        <h2 class="text-lg font-semibold text-indigo-700 mt-1">新規顧客の登録</h2>
                    </div>
                    <button onclick="goHome()" class="text-xs text-slate-400 hover:text-slate-600">&larr; 一覧に戻る</button>
                </div>
                <form id="customerForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">企業名 / 組織名</label>
                        <input type="text" id="companyName" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="株式会社サンプル">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">ご担当者名</label>
                        <input type="text" id="contactName" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="山田 太郎">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">メールアドレス</label>
                        <input type="email" id="email" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="yamada@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">ステータス</label>
                        <select id="status" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="lead">見込み (Lead)</option>
                            <option value="negotiating" selected>商談中 (Negotiating)</option>
                            <option value="active">成約 (Active)</option>
                            <option value="inactive">失注・保留 (Inactive)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">登録する &amp; 通知を送る</button>
                </form>
            </section>

            <section class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="tableTitle" class="text-lg font-semibold text-indigo-700">顧客一覧</h2>
                    <span id="customerCount" class="text-sm text-slate-500">0件</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b text-sm text-slate-500 bg-slate-50">
                                <th class="py-3 px-4">企業名</th>
                                <th class="py-3 px-4">ご担当者</th>
                                <th class="py-3 px-4">ステータス</th>
                                <th class="py-3 px-4">操作</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- サービス追加モーダル -->
    <div id="serviceModal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <h3 class="text-lg font-bold text-slate-800">新しいサービスを追加</h3>
            <form id="serviceForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">サービス名</label>
                    <input type="text" id="newServiceName" required class="w-full px-3 py-2 border rounded-lg outline-none" placeholder="例: Reach">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">説明文</label>
                    <textarea id="newServiceDesc" rows="3" class="w-full px-3 py-2 border rounded-lg outline-none" placeholder="概要"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeServiceModal()" class="px-4 py-2 border rounded-lg text-sm text-slate-600">キャンセル</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium">追加する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK & スクリプト -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
          apiKey: "AIzaSy... (あなたのAPIキー)",
          authDomain: "climin-bf45a.firebaseapp.com",
          projectId: "climin-bf45a",
          storageBucket: "climin-bf45a.appspot.com",
          messagingSenderId: "あなたのSENDER_ID",
          appId: "あなたのAPP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const NTFY_TOPIC_1 = "climin-notice-login-SSS465270";
        const NTFY_TOPIC_2 = "notice-climin-loginin-SSS465270";

        // 【許可する管理者IDリスト】
        const ALLOWED_IDS = ["sora", "admin", "yamada"];

        let code1 = "";
        let code2 = "";
        let currentLoginUser = "";
        let services = [];
        let customers = [];
        let currentServiceId = null;

        // 【Step 1】 ユーザー名入力 ➡️ ホワイトリスト検証 ➡️ 1つ目のトピックへコード送信
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputId = document.getElementById('loginId').value.trim();
            const lowerInputId = inputId.toLowerCase();

            const isAllowed = ALLOWED_IDS.map(id => id.toLowerCase()).includes(lowerInputId);

            if (!isAllowed) {
                alert("❌ アクセスが拒否されました。\n登録されていない管理者IDです。");
                return;
            }

            currentLoginUser = inputId;
            const btn = document.getElementById('loginBtn');

            btn.textContent = "送信中...";
            btn.disabled = true;

            code1 = Math.floor(1000 + Math.random() * 9000).toString();
            const message1 = `【Climin 認証 1/2】\nユーザー: ${currentLoginUser}\n確認コード1: [ ${code1} ]`;

            try {
                await fetch(`https://ntfy.sh/${NTFY_TOPIC_1}`, { method: 'POST', body: message1 });
            } catch (err) {
                console.log("ntfy送信エラー:", err);
            }

            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('auth1View').classList.remove('hidden');
            document.getElementById('auth1View').classList.add('flex');
            btn.textContent = "1つ目のコードを送信する";
            btn.disabled = false;
        });

        // 【Step 2】 1つ目のコード検証 ➡️ 2つ目のトピックへ送信
        window.verifyAuth1 = async function() {
            const inputVal = document.getElementById('auth1CodeInput').value.trim();
            if (inputVal === code1 && code1 !== "") {
                code2 = Math.floor(1000 + Math.random() * 9000).toString();
                const message2 = `【Climin 認証 2/2】\nユーザー: ${currentLoginUser}\n確認コード2: [ ${code2} ]`;

                try {
                    await fetch(`https://ntfy.sh/${NTFY_TOPIC_2}`, { method: 'POST', body: message2 });
                } catch (err) {
                    console.log("ntfy送信エラー:", err);
                }

                document.getElementById('auth1View').classList.add('hidden');
                document.getElementById('auth1View').classList.remove('flex');
                document.getElementById('auth2View').classList.remove('hidden');
                document.getElementById('auth2View').classList.add('flex');
            } else {
                alert('1つ目の確認コードが正しくありません。');
            }
        };

        // 【Step 3】 2つ目のコード検証 ➡️ 認証成功＆DBデータ取得
        window.verifyAuth2 = async function() {
            const inputVal = document.getElementById('auth2CodeInput').value.trim();
            if (inputVal === code2 && code2 !== "") {
                document.getElementById('auth2View').classList.add('hidden');
                document.getElementById('auth2View').classList.remove('flex');
                document.getElementById('userIdDisplay').textContent = `🔐 ユーザー: ${currentLoginUser}`;
                
                // 認証クリア後にデータを取得
                await loadDataFromFirestore();
            } else {
                alert('2つ目の確認コードが正しくありません。');
            }
        };

        window.logout = function() {
            if (!confirm("ログアウトしますか？")) return;
            location.reload();
        };

        async function loadDataFromFirestore() {
            try {
                const serviceSnapshot = await getDocs(collection(db, "services"));
                services = serviceSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                if (services.length === 0) {
                    const defaultServices = [
                        { name: 'Reach', description: '組織向けポータル＆メッセージングプラットフォームの顧客管理。', badge: 'Re' },
                        { name: 'Portal', description: '内部ツール管理用スペース。', badge: 'Po' }
                    ];
                    for (let s of defaultServices) {
                        const docRef = await addDoc(collection(db, "services"), s);
                        services.push({ id: docRef.id, ...s });
                    }
                }

                const customerSnapshot = await getDocs(collection(db, "customers"));
                customers = customerSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                renderServices();
            } catch (err) {
                console.error("Firestore読み込みエラー:", err);
                alert("データベースからのデータ取得に失敗しました。");
            }
        }

        async function sendNtfyAlert(title, message) {
            const bodyText = `${title}\n\n${message}`;
            try {
                await Promise.all([
                    fetch(`https://ntfy.sh/${NTFY_TOPIC_1}`, { method: 'POST', body: bodyText }),
                    fetch(`https://ntfy.sh/${NTFY_TOPIC_2}`, { method: 'POST', body: bodyText })
                ]);
            } catch (err) {}
        }

        window.renderServices = function() {
            const grid = document.getElementById('serviceGrid');
            grid.innerHTML = services.map(s => {
                const count = customers.filter(c => c.serviceId === s.id).length;
                return `
                    <div onclick="selectService('${s.id}')" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:border-indigo-500 hover:shadow-md transition cursor-pointer group flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center font-bold text-lg group-hover:bg-indigo-600 group-hover:text-white transition">
                                    ${escapeHtml(s.badge || 'Se')}
                                </div>
                                <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">顧客 ${count}件</span>
                            </div>
                            <h3 class="text-lg font-semibold text-slate-800 group-hover:text-indigo-600 transition">${escapeHtml(s.name)}</h3>
                            <p class="text-sm text-slate-500 mt-2">${escapeHtml(s.description || '')}</p>
                        </div>
                        <div class="mt-6 flex items-center text-sm font-medium text-indigo-600">顧客リストを開く &rarr;</div>
                    </div>
                `;
            }).join('');
        };

        window.selectService = function(serviceId) {
            currentServiceId = serviceId;
            const service = services.find(s => s.id === serviceId);
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('customerView').classList.remove('hidden');
            document.getElementById('currentViewTitle').textContent = `${service.name} (顧客管理)`;
            document.getElementById('formServiceTag').textContent = service.name;
            document.getElementById('tableTitle').textContent = `${service.name} の顧客一覧`;
            renderTable();
        };

        window.goHome = function() {
            currentServiceId = null;
            document.getElementById('dashboardView').classList.remove('hidden');
            document.getElementById('customerView').classList.add('hidden');
            document.getElementById('currentViewTitle').textContent = 'サービス選択ダッシュボード';
            renderServices();
        };

        function renderTable() {
            const serviceCustomers = customers.filter(c => c.serviceId === currentServiceId);
            const tbody = document.getElementById('customerTableBody');
            document.getElementById('customerCount').textContent = `${serviceCustomers.length}件`;
            
            if (serviceCustomers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400">データはまだありません</td></tr>`;
                return;
            }

            tbody.innerHTML = serviceCustomers.map(c => `
                <tr class="border-b hover:bg-slate-50 transition">
                    <td class="py-3 px-4 font-medium">${escapeHtml(c.companyName)}</td>
                    <td class="py-3 px-4">${escapeHtml(c.contactName)}</td>
                    <td class="py-3 px-4"><span class="px-2 py-1 text-xs rounded-full ${getStatusBadge(c.status)}">${getStatusLabel(c.status)}</span></td>
                    <td class="py-3 px-4"><button onclick="deleteCustomer('${c.id}')" class="text-rose-500 hover:text-rose-700 text-sm">削除</button></td>
                </tr>
            `).join('');
        }

        function getStatusLabel(status) {
            return { lead: '見込み', negotiating: '商談中', active: '成約', inactive: '保留' }[status] || status;
        }
        function getStatusBadge(status) {
            return { lead: 'bg-amber-100 text-amber-800', negotiating: 'bg-blue-100 text-blue-800', active: 'bg-emerald-100 text-emerald-800', inactive: 'bg-slate-100 text-slate-800' }[status] || 'bg-slate-100 text-slate-800';
        }
        function escapeHtml(str) {
            return (str || '').replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }

        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const service = services.find(s => s.id === currentServiceId);
            const companyName = document.getElementById('companyName').value;
            const contactName = document.getElementById('contactName').value;
            const email = document.getElementById('email').value;
            const status = document.getElementById('status').value;

            const newCustomerData = { serviceId: currentServiceId, companyName, contactName, email, status, createdAt: Date.now() };

            try {
                const docRef = await addDoc(collection(db, "customers"), newCustomerData);
                customers.unshift({ id: docRef.id, ...newCustomerData });
                renderTable();
                e.target.reset();
                await sendNtfyAlert(`【Climin】新規顧客登録 (${service.name})`, `企業: ${companyName}\n担当: ${contactName}`);
            } catch (err) {
                alert("顧客の保存に失敗しました。");
            }
        });

        window.deleteCustomer = async function(id) {
            if (!confirm("本当に削除しますか？")) return;
            try {
                await deleteDoc(doc(db, "customers", id));
                customers = customers.filter(c => c.id !== id);
                renderTable();
            } catch (err) {
                alert("削除に失敗しました。");
            }
        };

        window.openServiceModal = function() { document.getElementById('serviceModal').classList.remove('hidden'); document.getElementById('serviceModal').classList.add('flex'); };
        window.closeServiceModal = function() { document.getElementById('serviceModal').classList.add('hidden'); document.getElementById('serviceModal').classList.remove('flex'); };

        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('newServiceName').value.trim();
            const desc = document.getElementById('newServiceDesc').value.trim();
            const badge = name.slice(0, 2).toUpperCase();

            try {
                const docRef = await addDoc(collection(db, "services"), { name, description: desc, badge });
                services.push({ id: docRef.id, name, description: desc, badge });
                closeServiceModal();
                renderServices();
            } catch (err) {
                alert("サービスの保存に失敗しました。");
            }
        });
    </script>
</body>
</html>
